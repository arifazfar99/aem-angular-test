<div class="page d-flex align-items-center justify-content-center">
  <div class="card sign-in-card">
    <div class="card-header text-center">Sign in to your dashboard</div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <div class="form-group">
          <input
            type="email"
            class="form-control"
            placeholder="Username"
            formControlName="username"
            [class.is-invalid]="
              form.controls.username.invalid && form.controls.username.touched
            "
          />
          <div
            class="invalid-feedback"
            *ngIf="form.controls.username.errors?.['required']"
          >
            Username is required
          </div>
          <div
            class="invalid-feedback"
            *ngIf="form.controls.username.errors?.['email']"
          >
            Enter a valid email address
          </div>
        </div>

        <div class="form-group">
          <input
            type="password"
            class="form-control"
            placeholder="Password"
            formControlName="password"
            [class.is-invalid]="
              form.controls.password.invalid && form.controls.password.touched
            "
          />
          <div
            class="invalid-feedback"
            *ngIf="form.controls.password.errors?.['required']"
          >
            Password is required
          </div>
        </div>

        <button class="btn btn-primary sign-in-btn" type="submit" [disabled]="loading">
          {{ loading ? 'SIGNING IN...' : 'SIGN IN' }}
        </button>
      </form>
    </div>
  </div>
</div>
